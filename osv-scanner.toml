# osv-scanner の pre-push ゲート（.pre-commit-config.yaml の osv-scanner フック）向け triage 設定。
# 走査対象は package-lock.json。ここに載せるのは「現時点で安全に修正できない」脆弱性のみに限り、
# 理由（配信到達性・修正版の互換性）と再評価期日（ignoreUntil）を必ず併記する。
# 直接修正できるものは overrides で fixed 版へ上げる方針（本ファイルには載せない）。

# 現在の登録は 1 件（sprintf-js。2026-10-11 登録・2026-10-19 再登録・ignoreUntil 2026-11-02）。
# 内訳は本ファイル末尾の節。
#
# 2026-10-19 に sprintf-js の 1 件を再登録した（ignoreUntil 2026-10-25 → 2026-11-02）。延長ではなく
# 期限前の再判定で、判定は「該当するが監視のみ」のまま変わらない。確かめたこと:
#   - sprintf-js は最新が 1.1.3 で修正版が無い（1.1.3 も affected のため上げて消せない）
#   - mammoth は最新 1.13.0 でも argparse "~1.0.3" を引く（mammoth を上げても解消しない）
#   - 本リポの mammoth 参照は src/lib/attachments/docxText.ts の import 1 箇所だけで、
#     argparse を require する bin/mammoth（CLI）には触れない
# 解決経路は mammoth 1.12.3 → argparse 1.0.10 → sprintf-js 1.0.3 のまま変わっていない。
#
# 2026-10-11 に 2 件を登録し、同日そのうち 1 件を削除した。
# 登録したのは proxy-addr（GHSA-jqcg-44mw-7w3h）と sprintf-js（GHSA-hp3w-g68c-fv3c）で、
# どちらも「該当するが監視のみ」と判定していたものである。proxy-addr は express 経由の推移依存で、
# 修正版 2.0.8 が express の要求範囲 `^2.0.7` を満たすため package-lock.json の再解決だけで上がる。
# 同日その作業を行って 2.0.7 → 2.0.8 とし、osv-scanner が当該 ID を `has unused ignores` と
# 報告したため登録ごと削除した。sprintf-js は修正版が無いため登録を残している。
#
# 2026-09-23 に、残っていた 2 件を削除した（期限切れを待たず、上流で解消したため）:
#   - GHSA-frvp-7c67-39w9（@hono/node-server）
#   - GHSA-5qjj-4xww-7phc（valibot）
# いずれも prisma@7.8.0 の @prisma/dev 経由の推移依存だった。prisma を 7.10.0 へ上げると
# @prisma/dev が 0.24.3 → 0.24.17 になり、hono と @hono/node-server は依存ツリーから消滅し、
# valibot は 1.2.0 → 1.4.2（修正版）になる。osv-scanner 自身が両 ID を `has unused ignores` と
# 報告したため、延長ではなく登録ごと削除した。
#
# 同じ 2026-09-23 に、期限つきで登録していた 22 件も削除した。いずれも「修正版へ上げる作業は
# 別に行う」ための一時的な登録で、実際に次のとおり上げた結果すべて解消し、登録は unused になった
# （package-lock.json の解決版で確認済み）:
#   - undici   7.28.0 → 7.29.1        （5 件・direct dependency）
#   - qs       6.15.2 → 6.16.0        （2 件・override）
#   - mysql2   3.15.3 → 3.23.1        （2 件・override）
#   - fast-uri 3.1.4  → 3.1.8         （5 件・override）
#   - deepmerge-ts 7.1.5 → 8.0.0      （1 件・override）
#   - hono     4.12.27 → 依存ツリーから消滅（7 件。prisma 7.10.0 で @prisma/dev が hono を
#     要求しなくなったため。overrides の "hono": "4.13.7" は再出現時の下限として残置）
#
# 上げ先は、スキャナが示す修正版と、こちらで確認した修正版のうち**高い方**を採る
# （スキャナ側が低いことがあり、低い方へ上げると advisory は未解消のままスキャナだけ通る）。
# 「安全に修正できないものだけを載せる」という本ファイルの方針どおり、解消済みの ID は残さない。

# ---------------------------------------------------------------------------
# 2026-10-11 登録（1 件）。
#
# ignoreUntil は登録日 +2 週間。期限なしの登録はしない（恒久抑制になりガードレールが鳴らなくなる）。
# パッケージ単位ではなく ID 単位で登録する。
# ---------------------------------------------------------------------------

# sprintf-js 1.0.3（mammoth 1.12.3 → argparse 1.0.10 経由の推移依存・prod）。CVE-2026-97058 ／
# GHSA-hp3w-g68c-fv3c。上げ先なし（1.1.3 も affected のため、上げて消すことができない）。
# mammoth の中で argparse を require しているのは CLI（bin/mammoth）だけで、本リポは mammoth を
# ライブラリとして import するため（lib/index.js・src/lib/attachments/docxText.ts）、その経路は
# 読み込まれない。
[[IgnoredVulns]]
id = "GHSA-hp3w-g68c-fv3c"
ignoreUntil = 2026-11-02
reason = "sprintf-js 1.0.3 (runtime, transitive via mammoth 1.12.3 -> argparse 1.0.10), CVE-2026-97058: in scope but monitoring-only. There is no upgrade target - 1.1.3 is affected as well - so the choice is this registration or dropping mammoth. The flaw is an unvalidated precision specifier passed to toFixed, raising an uncaught RangeError, so it needs a format string reached with attacker-influenced input. Within mammoth, argparse is required only from bin/mammoth (the CLI); this repo imports mammoth as a library (lib/index.js, from src/lib/attachments/docxText.ts), so neither the CLI entry nor sprintf-js's format path is ever loaded."
