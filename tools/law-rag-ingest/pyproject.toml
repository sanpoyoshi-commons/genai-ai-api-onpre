[project]
name = "law-rag-ingest"
version = "0.1.0"
description = "e-Gov law XML -> JSONL ingest tool for law RAG (build-time, distributor-side)"
requires-python = ">=3.12"
# xml_to_jsonl.py は標準ライブラリのみ。load_to_db.py（DB 投入）は psycopg v3 を使う。
# psycopg は load_to_db の接続関数内で遅延 import するため、純関数のテストには不要。
dependencies = [
  "psycopg[binary]>=3.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "PERF"]
ignore = [
  "RUF001", # ambiguous-unicode-character-string（全角文字を使用するため）
  "RUF002", # ambiguous-unicode-character-docstring
  "RUF003", # ambiguous-unicode-character-comment
]

[tool.ruff.lint.per-file-ignores]
"xml_to_jsonl.py" = ["E501"]   # usage/error 文字列の長文を許容
"load_to_db.py" = ["E501"]     # usage/error 文字列の長文を許容
"bulk_download.py" = ["E501"]  # usage/error 文字列の長文を許容
